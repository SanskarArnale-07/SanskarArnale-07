name: Update live GitHub contribution count

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official GitHub contribution total
        uses: actions/github-script@v7
        id: count
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const to = new Date();
            const from = new Date(to.getTime() - 365 * 24 * 60 * 60 * 1000);
            const query = `
              query($login: String!, $from: DateTime!, $to: DateTime!) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    contributionCalendar { totalContributions }
                  }
                }
              }`;
            const data = await github.graphql(query, {
              login: "SanskarArnale-07",
              from: from.toISOString(),
              to: to.toISOString()
            });
            const total = data.user.contributionsCollection.contributionCalendar.totalContributions;
            core.setOutput("total", String(total));
            core.setOutput("updated", to.toISOString().slice(0, 10));
            core.info(`GitHub reports ${total} contributions in the last 365 days.`);

      - name: Create contribution count badge SVG
        env:
          TOTAL: ${{ steps.count.outputs.total }}
          UPDATED: ${{ steps.count.outputs.updated }}
        run: |
          mkdir -p dist
          cat > dist/contributions.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150">
            <rect width="560" height="150" rx="14" fill="#27243d"/>
            <text x="28" y="38" fill="#d7c3e8" font-family="Arial,sans-serif" font-size="16">GITHUB CONTRIBUTIONS · LAST 365 DAYS</text>
            <text x="28" y="105" fill="#fff0d6" font-family="Arial,sans-serif" font-size="54" font-weight="700">${TOTAL}</text>
            <text x="190" y="102" fill="#a9b99b" font-family="Arial,sans-serif" font-size="17">contributions</text>
            <text x="532" y="130" text-anchor="end" fill="#b9b0c8" font-family="Arial,sans-serif" font-size="11">Updated ${UPDATED} · GitHub GraphQL</text>
          </svg>
          EOF

      - name: Publish badge to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
